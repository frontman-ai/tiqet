name: Native alpha checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 / Zig 0.16.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install --yes git
      - name: Native suites and format checks
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/tiqet-home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/tiqet-zig-cache"
          mkdir -p "$HOME"
          test "$(zig version)" = 0.16.0
          git --version
          uname -sm
          (cd libs/core && zig build test --summary all)
          (cd apps/cli && zig build test --summary all)
          (cd libs/core && zig build test -Doptimize=ReleaseSafe --summary all)
          (cd apps/cli && zig build test -Doptimize=ReleaseSafe --summary all)
          (cd apps/cli && zig build test -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dcpu=baseline --summary all)
          zig fmt --check apps/cli/src libs/core/src
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --exclude='**/.zig-cache/**' --exclude='**/zig-out/**')"
